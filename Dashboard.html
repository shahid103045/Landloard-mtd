<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landlord MTD - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{margin:0; min-height:100vh; background:#eef3f8; display:flex; justify-content:center; align-items:center; padding:20px;}
#login-wrapper{width:100%; display:flex; justify-content:center; align-items:center;}
.login-box{width:100%; max-width:430px; background:white; padding:30px; border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,0.10);}
.login-box h1{margin:0 0 8px; color:#17324d; text-align:center; font-size:26px;}
.subtitle{text-align:center; color:#64748b; margin-bottom:25px; font-size:14px;}
.login-box label{display:block; margin-top:15px; margin-bottom:6px; font-weight:bold; color:#334155; font-size:14px;}
.login-box input{width:100%; padding:13px; border:1px solid #cbd5e1; border-radius:8px; font-size:16px;}
.password-row{display:flex; gap:8px;} .password-row input{flex:1;}
.show-button{padding:0 14px; border:none; border-radius:8px; background:#e8eef5; color:#17324d; cursor:pointer; font-weight:bold;}
.login-button{width:100%; margin-top:24px; padding:14px; border:none; border-radius:8px; background:#17324d; color:white; font-size:17px; font-weight:bold; cursor:pointer;}
#full-dashboard-wrapper{display:none; width:100%; max-width:1100px;}
#full-dashboard-wrapper .wrap{max-width:1100px;margin:0 auto;padding:20px;background:#000;color:#fff;border-radius:12px;}
#full-dashboard-wrapper h1{font-size:20px;text-align:center;margin-bottom:14px;letter-spacing:1px;color:#fff;}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.box{background:#111;border:1px solid #222;padding:12px;border-radius:10px;text-align:center}
.box small{display:block;font-size:10px;color:#777;margin-bottom:4px;text-transform:uppercase}
.box h2{font-size:18px;color:#fff;}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
#full-dashboard-wrapper input, #full-dashboard-wrapper select{padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;flex:1;min-width:120px}
.btn{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;color:#fff;font-size:13px}
.btn-blue{background:#2563eb}
.btn-green{background:#065f46}
.btn-green.active{background:#10b981;color:#000}
.btn-red{background:#7f1d1d}
.btn-red.active{background:#ef4444;color:#fff}
.btn-q{background:#111;border:1px solid #333;color:#666}
.btn-q.active{background:#fff;color:#000}
.btn-dl{background:#10b981;flex:1}
.btn-rep{background:#2563eb;flex:1}
.btn-del{background:#111;border:1px solid #444;color:#fff;padding:6px 14px;font-size:12px;border-radius:6px;cursor:pointer}
.btn-del:hover{background:#fff;color:#000}
#full-dashboard-wrapper table{width:100%;border-collapse:collapse;background:#111;border-radius:10px;overflow:hidden;margin-top:10px}
#full-dashboard-wrapper th{background:#1a1a1a;color:#777;padding:9px;font-size:11px;text-align:left;text-transform:uppercase}
#full-dashboard-wrapper td{padding:9px;border-bottom:1px solid #222;font-size:13px;word-wrap:break-word;white-space:normal;color:#fff;}
.badge{padding:3px 8px;border-radius:12px;font-size:11px}
.badge-earn{background:#d1fae5;color:#065f46}
.badge-exp{background:#fee2e2;color:#7f1d1d}
.badge-q{background:#2563eb;color:#fff;font-size:10px}
.summary-row{background:#0a2a1a !important;font-weight:bold;border-top:2px solid #10b981}
.summary-row td{color:#10b981}
@media(max-width:700px){
.cards{grid-template-columns:1fr 1fr}
.row{flex-direction:column}
#full-dashboard-wrapper table{font-size:11px}
#full-dashboard-wrapper th,#full-dashboard-wrapper td{padding:6px 4px}
.wrap{padding:10px}
}
.test-box{background:#111;border:1px solid #2563eb;padding:12px;border-radius:8px;margin:10px 0;font-size:12px;line-height:1.6;color:#fff;}
.test-pass{color:#10b981}
.test-fail{color:#ef4444}
</style>
</head>
<body>
<div id="login-wrapper">
<div class="login-box">
  <h1>Landlord MTD</h1>
  <p class="subtitle">Login to your landlord dashboard</p>
  <form id="loginForm">
    <label>Full Name</label><input type="text" id="name" placeholder="Enter your full name" required>
    <label>Email</label><input type="email" id="email" placeholder="Enter your email" required>
    <label>Phone / WhatsApp</label><input type="tel" id="phone" placeholder="+44 7..." required>
    <label>Password</label>
    <div class="password-row"><input type="password" id="password" placeholder="Enter password" minlength="8" required><button type="button" class="show-button" onclick="togglePassword()">Show</button></div>
    <button type="submit" class="login-button">LOGIN</button>
  </form>
</div>
</div>
<div id="full-dashboard-wrapper">
<div class="wrap">
<h1>LANDLORD DASHBOARD - 
<div class="cards">
<div class="box" style="border-color:#2563eb"><small>Total Income</small><h2 id="earn">£0</h2></div>
<div class="box"><small>Total Expense</small><h2 id="exp">£0</h2></div>
<div class="box"><small>Net Profit (Gross Profit)</small><h2 id="net">£0</h2></div>
<div class="box"><small>HMRC Tax (20%/40%/45%)</small><h2 id="deduct">£0</h2></div>
<div class="box" style="border-color:#10b981"><small>Owner After Tax</small><h2 id="total">£0</h2></div>
</div>
<div class="row" style="justify-content:center;background:#111;padding:8px;border-radius:8px;border:1px solid #222">
<small style="color:#666;padding:10px 4px">QUARTER:</small>
<button class="btn btn-q active" data-q="ALL" onclick="setQuarter('ALL')">ALL</button>
<button class="btn btn-q" data-q="Q1" onclick="setQuarter('Q1')">Q1</button>
<button class="btn btn-q" data-q="Q2" onclick="setQuarter('Q2')">Q2</button>
<button class="btn btn-q" data-q="Q3" onclick="setQuarter('Q3')">Q3</button>
<button class="btn btn-q" data-q="Q4" onclick="setQuarter('Q4')">Q4</button>
<button class="btn btn-q" data-q="ANNUAL" onclick="setQuarter('ANNUAL')">ANNUAL</button>
</div>
<div class="row">
<button id="btnEarn" class="btn btn-green active" onclick="setType('Income')">INCOME</button>
<button id="btnExp" class="btn btn-red" onclick="setType('Expense')">EXPENSE</button>
<select id="expType">
<option value="Rent">Rent</option>
<option value="Repairs">Repairs</option>
<option value="Maintenance">Maintenance</option>
<option value="Insurance">Insurance</option>
<option value="Management">Management</option>
<option value="Utilities">Utilities</option>
<option value="Other">Other</option>
<option value="Farah">Farah</option>
</select>
<select id="qSelect"><option value="Q1">Q1</option><option value="Q2">Q2</option><option value="Q3" selected>Q3</option><option value="Q4">Q4</option></select>
</div>
<div class="row">
<input id="date" type="date">
<input id="desc" placeholder="Description">
<input id="amt" type="number" placeholder="Amount £" step="0.01">
<button class="btn btn-blue" onclick="addTx()">Add Transaction</button>
</div>
<div class="row">
<button class="btn btn-dl" onclick="downloadExcel()">Download Excel - </button>
<button class="btn btn-rep" onclick="downloadExtra()">Extra Report</button>
<button class="btn btn-q" onclick="runTests()">Run HMRC Tests Sir</button>
</div>
<div id="testResults"></div>
<table>
<thead><tr><th>Date</th><th>Q</th><th>Type</th><th>Category</th><th>Description</th><th>Gross Profit</th><th>HMRC Tax</th><th>Owner After Tax</th><th>Action</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
function togglePassword(){
  const p=document.getElementById("password"); const b=document.querySelector(".show-button");
  if(p.type==="password"){p.type="text"; b.textContent="Hide";} else {p.type="password"; b.textContent="Show";}
}
window.addEventListener('load', function(){
  document.getElementById('full-dashboard-wrapper').style.display='none';
  document.getElementById('login-wrapper').style.display='flex';
  document.body.style.background='#eef3f8';
  document.body.style.display='flex';
});
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  localStorage.setItem("landlordProfile", JSON.stringify({
    name:document.getElementById("name").value.trim(),
    email:document.getElementById("email").value.trim(),
    phone:document.getElementById("phone").value.trim()
  }));
  document.getElementById('login-wrapper').style.display='none';
  document.getElementById('full-dashboard-wrapper').style.display='block';
  document.body.style.background='#000';
  document.body.style.display='block';
  document.body.style.padding='0';
  render();
});
let currentType='Income';
let currentQuarterFilter='ALL';
const PA_BASE=13570;
function calculateTax(taxableProfit) {
  if (taxableProfit <= 0) return 0;
  const basicLimit = 37700;
  const higherLimit = 112570;
  let tax = 0;
  if (taxableProfit <= basicLimit) { tax = taxableProfit * 0.2; }
  else if (taxableProfit <= higherLimit) { tax = basicLimit * 0.2 + (taxableProfit - basicLimit) * 0.4; }
  else { tax = basicLimit * 0.2 + (higherLimit - basicLimit) * 0.4 + (taxableProfit - higherLimit) * 0.45; }
  return tax;
}
function getTxKey(t){ return `${t.date}|${t.quarter}|${t.type}|${t.cat}|${t.desc}|${Number(t.amt).toFixed(2)}`; }
function dedupTxArray(arr){
  const seen = new Set(); const out = [];
  arr.forEach(t=>{ const k = getTxKey(t); if(!seen.has(k)){ seen.add(k); out.push(t); } });
  return out;
}
let rawTx=JSON.parse(localStorage.getItem('black_final_v5')||'[]');
let tx=dedupTxArray(rawTx);
localStorage.setItem('black_final_v5',JSON.stringify(tx));
function setType(t){
  currentType=t;
  document.getElementById('btnEarn').className=t==='Income'?'btn btn-green active':'btn btn-green';
  document.getElementById('btnExp').className=t==='Expense'?'btn btn-red active':'btn btn-red';
}
function setQuarter(q){
  currentQuarterFilter=q;
  document.querySelectorAll('#full-dashboard-wrapper .btn-q').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector(`#full-dashboard-wrapper .btn-q[data-q="${q}"]`);
  if(btn) btn.classList.add('active');
  render();
}
function addTx(){
  let d=document.getElementById('date').value||new Date().toISOString().slice(0,10);
  let q=document.getElementById('qSelect').value;
  let desc=document.getElementById('desc').value.trim()||document.getElementById('expType').value;
  let amt=parseFloat(document.getElementById('amt').value);
  let cat=document.getElementById('expType').value;
  if(!amt||amt<=0){alert('Enter amount Sir');return;}
  let newTx={date:d,quarter:q,type:currentType,cat,desc,amt};
  let isDup = tx.some(t=> getTxKey(t)===getTxKey(newTx) );
  if(isDup){alert('Duplicate entry Sir - Already saved!');return;}
  tx.push(newTx); tx=dedupTxArray(tx);
  localStorage.setItem('black_final_v5',JSON.stringify(tx));
  document.getElementById('desc').value=''; document.getElementById('amt').value='';
  render();
}
function delTx(idx){ tx.splice(idx,1); localStorage.setItem('black_final_v5',JSON.stringify(tx)); render(); }
function render(){
  let tbody=document.getElementById('tbody'); if(!tbody) return; tbody.innerHTML='';
  let cardData = tx;
  if(currentQuarterFilter!=='ALL' && currentQuarterFilter!=='ANNUAL'){ cardData = tx.filter(t=>t.quarter===currentQuarterFilter); }
  cardData=dedupTxArray(cardData);
  let cEarn=0,cExp=0;
  cardData.forEach(t=>{if(t.type==='Income') cEarn+=Number(t.amt)||0; else cExp+=Number(t.amt)||0;});
  let cNet=cEarn-cExp; let taxable = Math.max(0, cNet - PA_BASE); let totalTax = calculateTax(taxable); let owner = cNet - totalTax;
  document.getElementById('earn').innerText='£'+cEarn.toFixed(2);
  document.getElementById('exp').innerText='£'+cExp.toFixed(2);
  document.getElementById('net').innerText='£'+cNet.toFixed(2);
  document.getElementById('deduct').innerText='£'+totalTax.toFixed(2);
  document.getElementById('total').innerText='£'+owner.toFixed(2);
  let displayData = (currentQuarterFilter==='ALL'||currentQuarterFilter==='ANNUAL') ? tx.slice() : tx.filter(t=>t.quarter===currentQuarterFilter);
  displayData = dedupTxArray(displayData); displayData.sort((a,b)=> new Date(a.date) - new Date(b.date));
  let cumulativeProfit=0, prevTotalTax=0, shown=0;
  displayData.forEach((t)=>{
    shown++; let amt=Number(t.amt)||0; let signedAmt = t.type==='Income' ? amt : -amt;
    cumulativeProfit += signedAmt; let taxableCumulative = Math.max(0, cumulativeProfit - PA_BASE);
    let totalTaxCumulative = calculateTax(taxableCumulative); let incrementalTax = totalTaxCumulative - prevTotalTax;
    prevTotalTax = totalTaxCumulative; let ownerRow = signedAmt - incrementalTax;
    let grossDisplay = t.type==='Income' ? `£${amt.toFixed(2)}` : `-£${amt.toFixed(2)}`;
    let originalIdx = tx.findIndex(origTx=> getTxKey(origTx)===getTxKey(t));
    let tr=document.createElement('tr');
    tr.innerHTML=`<td>${t.date}</td><td><span class="badge-q">${t.quarter}</span></td><td><span class="badge ${t.type==='Income'?'badge-earn':'badge-exp'}">${t.type}</span></td><td>${t.cat}</td><td>${t.desc}</td><td><b>${grossDisplay}</b></td><td>£${incrementalTax.toFixed(2)}</td><td>£${ownerRow.toFixed(2)}</td><td><button class="btn-del" onclick="delTx(${originalIdx})">Delete</button></td>`;
    tbody.appendChild(tr);
  });
  if(shown===0){ tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;color:#555;padding:20px">No transactions for ${currentQuarterFilter}</td></tr>`; }
  else { let trSum=document.createElement('tr'); trSum.className='summary-row'; trSum.innerHTML=`<td colspan="5" style="text-align:right">QUARTERLY SUMMARY - PA ${PA_BASE} ONCE - Taxable £${taxable.toFixed(2)}:</td><td>£${cNet.toFixed(2)}</td><td>£${totalTax.toFixed(2)}</td><td>£${owner.toFixed(2)}</td><td></td>`; tbody.appendChild(trSum); }
}
function downloadExcel(){
  if(tx.length==0){alert('No transactions Sir');return;}
  let rawData=(currentQuarterFilter==='ALL'||currentQuarterFilter==='ANNUAL') ? tx.slice() : tx.filter(t=>t.quarter===currentQuarterFilter);
  let data=dedupTxArray(rawData); data.sort((a,b)=> new Date(a.date) - new Date(b.date));
  let wb=XLSX.utils.book_new(); let digitalRows=[];
  digitalRows.push(['Digital_Records - HMRC MTD Digital Record - ']);
  digitalRows.push(['Quarter Filter', currentQuarterFilter]); digitalRows.push(['Generated', new Date().toLocaleString()]);
  digitalRows.push(['Logic', 'ONE ROW = ONE TRANSACTION = FULL DIGITAL RECORD  - Tax on RUNNING TOTAL ']); digitalRows.push([]);
  digitalRows.push(['Date','Type','Category','Gross','Tax','After Tax','ID']);
  let cumulativeProfit=0, prevTotalTax=0, totalIncome=0, totalExpenses=0;
  data.forEach(t=>{
    let amt=Number(t.amt)||0; let signedAmt = t.type==='Income' ? amt : -amt;
    if(t.type==='Income') totalIncome+=amt; else totalExpenses+=amt;
    cumulativeProfit += signedAmt; let taxableCumulative = Math.max(0, cumulativeProfit - PA_BASE);
    let totalTaxCumulative = calculateTax(taxableCumulative); let incrementalTax = totalTaxCumulative - prevTotalTax;
    prevTotalTax = totalTaxCumulative; let ownerRow = signedAmt - incrementalTax;
    let rowId = `${t.date}-${t.quarter}-${digitalRows.length - 5}`;
    digitalRows.push([t.date,t.type,t.cat,Number(amt.toFixed(2)),Number(incrementalTax.toFixed(2)),Number(ownerRow.toFixed(2)),rowId]);
  });
  digitalRows.push([]); digitalRows.push(['--- RUNNING TOTAL CHECK  ---']);
  digitalRows.push(['Cumulative Profit (Running Total)', Number(cumulativeProfit.toFixed(2))]);
  digitalRows.push(['Total Tax (SUM of HMRC Tax column)', Number(prevTotalTax.toFixed(2))]);
  let ws1=XLSX.utils.aoa_to_sheet(digitalRows); ws1['!cols']=[{wch:30},{wch:18},{wch:25},{wch:18},{wch:15},{wch:18},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws1,'Digital_Records');
  let taxableFinal = Math.max(0, cumulativeProfit - PA_BASE); let totalTaxFinal = calculateTax(taxableFinal);
  let ownerAfterTaxFinal = cumulativeProfit - totalTaxFinal; let quarterlyRows=[];
  quarterlyRows.push(['HMRC_Quarterly - SUMMARY ONLY - ALWAYS 6 LINES Sir']); quarterlyRows.push(['Quarter', currentQuarterFilter]);
  quarterlyRows.push(['Generated', new Date().toLocaleString()]); quarterlyRows.push(['Note', 'Whether 10 or 20 or 30 transactions Sir - This tab NEVER gets big Sir - Always fixed Sir']); quarterlyRows.push([]);
  quarterlyRows.push(['Description','Amount (£)']); quarterlyRows.push(['Total Income (SUM Income rows from Tab1)', Number(totalIncome.toFixed(2))]);
  quarterlyRows.push(['Total Expenses (SUM Expense rows from Tab1)', Number(totalExpenses.toFixed(2))]);
  quarterlyRows.push(['Gross Profit (Income - Expenses)', Number(cumulativeProfit.toFixed(2))]);
  quarterlyRows.push(['Personal Allowance (PA) - APPLIED ONLY ONCE Sir', PA_BASE]);
  quarterlyRows.push(['Taxable Profit (Gross - PA)', Number(taxableFinal.toFixed(2))]);
  quarterlyRows.push(['Total HMRC Tax (SUM Tax column Tab1 = calculateTax(Taxable))', Number(totalTaxFinal.toFixed(2))]);
  quarterlyRows.push(['Owner After Tax (Gross - Tax)', Number(ownerAfterTaxFinal.toFixed(2))]);
  let ws2=XLSX.utils.aoa_to_sheet(quarterlyRows); ws2['!cols']=[{wch:55},{wch:22}]; XLSX.utils.book_append_sheet(wb,ws2,'HMRC_Quarterly');
  XLSX.writeFile(wb,'META_BLUE_FINAL_2TABS_'+currentQuarterFilter+'.xlsx');
}
function downloadExtra(){
  if(tx.length==0){alert('No transactions ');return;}
  let dataDedup=dedupTxArray(tx).sort((a,b)=> new Date(a.date) - new Date(b.date));
  let data=(currentQuarterFilter==='ALL'||currentQuarterFilter==='ANNUAL')?dataDedup:dataDedup.filter(t=>t.quarter===currentQuarterFilter);
  let wb=XLSX.utils.book_new(); let rows=[['EXTRA REPORT - FINAL Sir'],['Date','Type','Category','Gross','Tax (Running)','Owner','Quarter']];
  let cum=0, prevTax=0;
  data.forEach(t=>{ let amt=Number(t.amt)||0; let signed=t.type==='Income'?amt:-amt; cum+=signed; let taxable=Math.max(0,cum-PA_BASE); let totTax=calculateTax(taxable); let incTax=totTax-prevTax; prevTax=totTax; let owner=signed-incTax; rows.push([t.date,t.type,t.cat,amt,Number(incTax.toFixed(2)),Number(owner.toFixed(2)),t.quarter]); });
  let ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:14},{wch:12},{wch:15},{wch:12},{wch:15},{wch:15},{wch:10}]; XLSX.utils.book_append_sheet(wb,ws,'Extra'); XLSX.writeFile(wb,'Extra_FINAL_'+currentQuarterFilter+'.xlsx');
}
function runTests(){
  let t1_taxable=Math.max(0,60000-PA_BASE); let t1_tax=calculateTax(t1_taxable);
  let t2_taxable=Math.max(0,130000-PA_BASE); let t2_tax=calculateTax(t2_taxable); let t2_owner=130000-t2_tax;
  let html=`<div class="test-box"><b>FINAL 2 TABS VERIFICATION Sir:</b><br>Taxable = profit - PA (13570 once) - <=37700 @20%, <=112570 @40%, else @45%<br><br><b>Test 1: Only £60,000</b> Tax £${t1_tax.toFixed(2)} - <span class="${Math.abs(t1_tax-11032)<1?'test-pass':'test-fail'}">${Math.abs(t1_tax-11032)<1?'PASS':'FAIL'}</span><br><b>Test 2: £130k</b> Tax £${t2_tax.toFixed(2)} Owner £${t2_owner.toFixed(2)}<br></div>`;
  document.getElementById('testResults').innerHTML=html;
}
render();
</script>
</body>
</html>
